name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify release tag
        run: |
          node --input-type=module -e "
            import core from './packages/core/package.json' with { type: 'json' };
            import adapter from './packages/better-sqlite3/package.json' with { type: 'json' };
            const tag = process.env.GITHUB_REF_NAME;
            if (core.version !== adapter.version || tag !== 'v' + core.version) {
              throw new Error('Tag and package versions must match');
            }
          "
      - name: Stage core
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if ! npm view "@walq/core@$VERSION" version >/dev/null 2>&1; then
            pnpm --filter @walq/core pack --pack-destination "$RUNNER_TEMP"
            npm stage publish "$RUNNER_TEMP/walq-core-$VERSION.tgz" --access public --provenance
          fi
      - name: Stage better-sqlite3 adapter
        run: |
          VERSION=$(node -p "require('./packages/better-sqlite3/package.json').version")
          if ! npm view "@walq/better-sqlite3@$VERSION" version >/dev/null 2>&1; then
            pnpm --filter @walq/better-sqlite3 pack --pack-destination "$RUNNER_TEMP"
            npm stage publish "$RUNNER_TEMP/walq-better-sqlite3-$VERSION.tgz" --access public --provenance
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --notes-file "release-notes/$GITHUB_REF_NAME.md"
