name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify release tag
        run: |
          node --input-type=module -e "
            import core from './packages/core/package.json' with { type: 'json' };
            import adapter from './packages/better-sqlite3/package.json' with { type: 'json' };
            import common from './packages/sqlite-common/package.json' with { type: 'json' };
            import sqlite from './packages/sqlite/package.json' with { type: 'json' };
            const tag = process.env.GITHUB_REF_NAME;
            if ([core, common, adapter, sqlite].some((pkg) => tag !== 'v' + pkg.version)) {
              throw new Error('Tag and package versions must match');
            }
          "
      - name: Stage packages in dependency order
        run: |
          for PACKAGE in core sqlite-common better-sqlite3 sqlite; do
            VERSION=$(node -p "require('./packages/$PACKAGE/package.json').version")
            if ! npm view "@walq/$PACKAGE@$VERSION" version >/dev/null 2>&1; then
              pnpm --filter "@walq/$PACKAGE" pack --pack-destination "$RUNNER_TEMP"
              npm stage publish "$RUNNER_TEMP/walq-$PACKAGE-$VERSION.tgz" --access public --provenance
            fi
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --notes-file "release-notes/$GITHUB_REF_NAME.md"
