name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    env:
      # Needed only to bootstrap packages that do not exist on npm yet. Remove
      # the secret after configuring trusted publishing for both packages.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify release tag
        run: |
          node --input-type=module -e "
            import walq from './packages/walq/package.json' with { type: 'json' };
            import adapter from './packages/better-sqlite3/package.json' with { type: 'json' };
            const tag = process.env.GITHUB_REF_NAME;
            if (walq.version !== adapter.version || tag !== 'v' + walq.version) {
              throw new Error('Tag and package versions must match');
            }
          "
      - name: Publish walq
        run: |
          VERSION=$(node -p "require('./packages/walq/package.json').version")
          npm view "walq@$VERSION" version >/dev/null 2>&1 || pnpm --filter walq publish --access public --provenance --no-git-checks
      - name: Publish better-sqlite3 adapter
        run: |
          VERSION=$(node -p "require('./packages/better-sqlite3/package.json').version")
          npm view "@walq/better-sqlite3@$VERSION" version >/dev/null 2>&1 || pnpm --filter @walq/better-sqlite3 publish --access public --provenance --no-git-checks
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes
